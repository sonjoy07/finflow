name: FinFlow Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Lint, Typecheck, Unit Tests & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install Dependencies (Deterministic Lockfile)
        run: npm ci

      - name: TypeScript Type Checking
        run: npm run typecheck

      - name: ESLint Code Quality Verification
        run: npm run lint

      - name: Unit & Component Tests (Vitest + Coverage)
        run: npm run test:coverage

      - name: Verify Next.js Standalone Production Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NODE_ENV: production

  e2e-tests:
    name: Playwright End-to-End Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: quality-gate

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Chromium Browser
        run: npx playwright install --with-deps chromium

      - name: Execute Playwright E2E Suite
        run: npm run test:e2e
        env:
          CI: true

      - name: Upload E2E Test Report on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
